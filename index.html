<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도쿄 4박5일 커플 여행 일정 & 체크리스트</title>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; line-height: 1.6; }
    h1, h2 { color: #333; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #fafafa; }
    .todo-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .todo-item.completed span { text-decoration: line-through; color: #888; }
    input[type="text"] { padding: 8px; width: 70%; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 12px; background: #4285f4; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #3367d6; }
    .delete-btn { background: #dc3545; padding: 4px 8px; font-size: 12px; margin-left: auto; }
    .delete-btn:hover { background: #bd2130; }
  </style>
</head>
<body>

  <h1>🇯🇵 도쿄 커플 4박 5일 여행 플래너</h1>

  <!-- 1. 준비물 체크리스트 섹션 (실시간 대화형) -->
  <div class="card">
    <h2>📋 여행 준비물 체크리스트 (실시간 동기화)</h2>
    <div style="margin-bottom: 15px;">
      <input type="text" id="checkInput" placeholder="새 체크리스트 항목 입력 (예: 돼지코 챙기기)">
      <button id="addCheckBtn">추가</button>
    </div>
    <div id="checklistContainer">로딩 중...</div>
  </div>

  <!-- 2. 도쿄 4박 5일 일정표 섹션 -->
  <div class="card">
    <h2>🗓️ 4박 5일 대표 일정</h2>
    <ul>
      <li><strong>1일차:</strong> 입국 ➔ 숙소 체크인 ➔ 신주쿠 야경 & 저녁 식사</li>
      <li><strong>2일차:</strong> 아사쿠사 센소지 ➔ 스카이트리 ➔ 아키하바라</li>
      <li><strong>3일차:</strong> 도쿄 디즈니씨 (전일)</li>
      <li><strong>4일차:</strong> 시부야 스카이 ➔ 하라주쿠/오모테산도 쇼핑 ➔ 롯폰기 힐즈</li>
      <li><strong>5일차:</strong> 긴자 브런치 & 쇼핑 ➔ 공항 이동 및 출국</li>
    </ul>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      doc, 
      updateDoc, 
      deleteDoc, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyCIxdpE0ogvq2oCQ4YR2zABhqUXJ_rNK6Y",
      authDomain: "ssss-56bb0.firebaseapp.com",
      projectId: "ssss-56bb0",
      storageBucket: "ssss-56bb0.firebasestorage.app",
      messagingSenderId: "1075238133078",
      appId: "1:1075238133078:web:2e99e2b13f242920facaf7",
      measurementId: "G-3BJQV8MH63"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const checklistRef = collection(db, "tokyo_checklist");

    const checkInput = document.getElementById("checkInput");
    const addCheckBtn = document.getElementById("addCheckBtn");
    const checklistContainer = document.getElementById("checklistContainer");

    // 1. 체크리스트 항목 추가
    addCheckBtn.addEventListener("click", async () => {
      const text = checkInput.value.trim();
      if (!text) return;

      try {
        await addDoc(checklistRef, {
          text: text,
          completed: false,
          createdAt: serverTimestamp()
        });
        checkInput.value = "";
      } catch (e) {
        console.error("추가 실패:", e);
      }
    });

    // 2. 실시간 데이터 수신 및 화면 그려주기 (onSnapshot)
    const q = query(checklistRef, orderBy("createdAt", "asc"));
    onSnapshot(q, (snapshot) => {
      checklistContainer.innerHTML = "";

      if (snapshot.empty) {
        checklistContainer.innerHTML = "<p>등록된 체크리스트가 없습니다. 항목을 추가해 보세요!</p>";
        return;
      }

      snapshot.forEach((docSnap) => {
        const item = docSnap.data();
        const id = docSnap.id;

        const div = document.createElement("div");
        div.className = `todo-item ${item.completed ? 'completed' : ''}`;

        // 체크박스 생성 및 실시간 상태 업데이트 처리
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = item.completed;
        checkbox.addEventListener("change", async () => {
          await updateDoc(doc(db, "tokyo_checklist", id), {
            completed: checkbox.checked
          });
        });

        const span = document.createElement("span");
        span.textContent = item.text;

        // 삭제 버튼
        const delBtn = document.createElement("button");
        delBtn.textContent = "삭제";
        delBtn.className = "delete-btn";
        delBtn.addEventListener("click", async () => {
          await deleteDoc(doc(db, "tokyo_checklist", id));
        });

        div.appendChild(checkbox);
        div.appendChild(span);
        div.appendChild(delBtn);
        checklistContainer.appendChild(div);
      });
    });
  </script>

</body>
</html>
