<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase 실시간 업로드 예제</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input { padding: 8px; width: 250px; }
    button { padding: 8px 12px; cursor: pointer; }
    ul { margin-top: 15px; }
    li { margin-bottom: 5px; }
  </style>
</head>
<body>

  <h2>Firebase 실시간 데이터 업로드</h2>
  
  <div>
    <input type="text" id="userInput" placeholder="할 일이나 메시지 입력">
    <button id="addBtn">업로드</button>
  </div>

  <h3>실시간 데이터 목록</h3>
  <ul id="dataList"></ul>

  <!-- Firebase SDK (v10 모듈) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      serverTimestamp, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCIxdpE0ogvq2oCQ4YR2zABhqUXJ_rNK6Y",
      authDomain: "ssss-56bb0.firebaseapp.com",
      projectId: "ssss-56bb0",
      storageBucket: "ssss-56bb0.firebasestorage.app",
      messagingSenderId: "1075238133078",
      appId: "1:1075238133078:web:2e99e2b13f242920facaf7",
      measurementId: "G-3BJQV8MH63"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const messagesCollection = collection(db, "messages");

    const userInput = document.getElementById("userInput");
    const addBtn = document.getElementById("addBtn");
    const dataList = document.getElementById("dataList");

    // 실시간 데이터 추가
    addBtn.addEventListener("click", async () => {
      const text = userInput.value.trim();
      if (!text) return;

      try {
        await addDoc(messagesCollection, {
          text: text,
          createdAt: serverTimestamp()
        });
        userInput.value = "";
      } catch (error) {
        console.error("업로드 에러:", error);
      }
    });

    // 실시간 데이터 수신 리스너
    const q = query(messagesCollection, orderBy("createdAt", "asc"));
    onSnapshot(q, (snapshot) => {
      dataList.innerHTML = "";
      snapshot.forEach((doc) => {
        const data = doc.data();
        const li = document.createElement("li");
        li.textContent = data.text || "(내용 없음)";
        dataList.appendChild(li);
      });
    });
  </script>

</body>
</html>
